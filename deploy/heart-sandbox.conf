[Service]
# Bubblewrap sets up its private network namespace through netlink.
RestrictAddressFamilies=
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
# The masked /proc submounts prevent an unprivileged worker from mounting
# its own PID-namespace /proc. UID separation + NoNewPrivileges remain active.
ProtectKernelTunables=false
